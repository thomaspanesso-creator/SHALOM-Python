<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Especialista — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Parisienne&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/shalom-reset.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
{% include 'layouts/navbar.html' %}
<main>
    {% include 'layouts/messages.html' %}
    <div class="container-lg py-4">
        <div class="card card-page p-4">
            <h3 class="section-title">Editar Especialista</h3>
            <form action="/specialists/{{ specialist.id }}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="name">Nombre</label>
                    <input type="text" id="name" name="name" class="form-control {{ 'is-invalid' if errors.get('name') else '' }}" maxlength="100" minlength="2" required
                           value="{{ form.get('name', specialist.name or '') }}" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñÀÈÌÒÙàèìòùÂÊÎÔÛâêîôûÇç' .\-]+"
                           title="Solo letras, espacios, apóstrofos y guiones">
                    {% if errors.get('name') %}<div class="invalid-feedback d-block">{{ errors.get('name') }}</div>{% endif %}
                </div>
                <div class="mb-3">
                    <label class="form-label" for="specialty">Especialidad</label>
                    <input type="text" id="specialty" name="specialty" class="form-control {{ 'is-invalid' if errors.get('specialty') else '' }}" maxlength="100" minlength="2" required
                           value="{{ form.get('specialty', specialist.specialty or '') }}" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñÀÈÌÒÙàèìòùÂÊÎÔÛâêîôûÇç' .\-]+"
                           title="Solo letras, espacios, apóstrofos y guiones">
                    {% if errors.get('specialty') %}<div class="invalid-feedback d-block">{{ errors.get('specialty') }}</div>{% endif %}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-shalom-primary">Guardar</button>
                    <a href="/specialists" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
