<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Especialistas Más Solicitadas — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- LIBRERÍA AGREGADA: SheetJS para convertir tablas HTML a Excel -->
    <script src="https://jsdelivr.net"></script>
</head>

<body>
    {% include 'layouts/navbar.html' %}
    <main>
        <div class="container-lg py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="section-title mb-0"><i class="bi bi-person-heart"></i> Especialistas Más Solicitadas</h2>
                <div>
                    <!-- BOTÓN AGREGADO: Ejecuta la función de descarga al hacer clic -->
                    <button onclick="exportarEspecialistasAExcel()" class="btn btn-success me-2">
                        <i class="bi bi-file-earmark-excel"></i> Descargar Excel
                    </button>
                    <a class="btn btn-outline-secondary" href="{{ '/dashboard' }}"><i class="bi bi-arrow-left"></i>
                        Volver</a>
                </div>
            </div>
            <div class="appointments-card">
                <div class="table-responsive">
                    <!-- ID AGREGADO: Identifica esta tabla específica en JavaScript -->
                    <table class="table" id="tablaEspecialistas">
                        <thead>
                            <tr>
                                <th>Especialista</th>
                                <th>Citas asignadas</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for row in especialistas %}<tr>
                                <td>{{ row[0] }}</td>
                                <td>{{ row[1] }}</td>
                            </tr>{% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>

    <!-- SCRIPT AGREGADO: Función para procesar la tabla y descargar el archivo -->
    <script>
        function exportarEspecialistasAExcel() {
            // Obtiene la tabla de especialistas por su ID
            var tabla = document.getElementById('tablaEspecialistas');

            // Convierte el contenido de la tabla en una hoja de Excel
            var libro = XLSX.utils.table_to_book(tabla, { sheet: "Especialistas" });

            // Genera la descarga automática con un nombre personalizado para este reporte
            XLSX.writeFile(libro, 'Reporte_Especialistas_Shalom.xlsx');
        }
    </script>
</body>

</html>
