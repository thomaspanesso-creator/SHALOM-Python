<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario Bajo — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- LIBRERÍA AGREGADA: SheetJS para convertir tablas HTML a Excel -->
    <script src="https://jsdelivr.net"></script>
</head>

<body>
    {% include 'layouts/navbar.html' %}
    <main>
        <div class="container-lg py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="section-title mb-0"><i class="bi bi-exclamation-triangle"></i> Inventario Bajo</h2>
                <div>
                    <!-- BOTÓN AGREGADO: Ejecuta la descarga controlada de Excel -->
                    <button onclick="exportarInventarioAExcel()" class="btn btn-success me-2">
                        <i class="bi bi-file-earmark-excel"></i> Descargar Excel
                    </button>
                    <a class="btn btn-outline-secondary" href="{{ '/dashboard' }}"><i class="bi bi-arrow-left"></i>
                        Volver</a>
                </div>
            </div>
            {% if not productos %}
                <div class="alert alert-success text-center">¡Todo el inventario está en niveles saludables!</div>
            {% endif %}
            {% if not (not productos) %}
                <div class="appointments-card">
                    <div class="table-responsive">
                        <!-- ID AGREGADO: Identifica esta tabla en JavaScript -->
                        <table class="table" id="tablaInventario">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Categoría</th>
                                    <th>Stock</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for p in productos %}<tr>
                                    <td>{{ p.product_name }}</td>
                                    <td>{{ p.category }}</td>
                                    <td><span class="badge-pendiente">{{ p.stock }}</span></td>
                                </tr>{% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            {% endif %}
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>

    <!-- SCRIPT AGREGADO: Procesa los datos y maneja alertas si está vacío -->
    <script>
        function exportarInventarioAExcel() {
            // Busca la tabla en el documento
            var tabla = document.getElementById('tablaInventario');

            // Validación: Si la tabla no existe, significa que el inventario está vacío
            if (!tabla) {
                Swal.fire({
                    icon: 'info',
                    title: 'Reporte vacío',
                    text: 'No hay productos con stock bajo para exportar en este momento.',
                    confirmButtonColor: '#6f7f5d'
                });
                return;
            }

            // Transforma el HTML físico a un archivo Excel
            var libro = XLSX.utils.table_to_book(tabla, { sheet: "Inventario Bajo" });

            // Descarga el documento
            XLSX.writeFile(libro, 'Reporte_Inventario_Bajo_Shalom.xlsx');
        }
    </script>
</body>

</html>
