<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servicios Más Solicitados — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- LIBRERÍA AGREGADA: SheetJS para convertir tablas HTML a Excel -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>
{% include 'layouts/navbar.html' %}
<main>
    <div class="container-lg py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title mb-0"><i class="bi bi-stars"></i> Servicios Más Solicitados</h2>
            <div>
                <!-- BOTÓN AGREGADO: Descarga el reporte al hacer clic -->
                <button onclick="exportarServiciosAExcel()" class="btn btn-success me-2">
                    <i class="bi bi-file-earmark-excel"></i> Descargar Excel
                </button>
                <a class="btn btn-outline-secondary" href="{{ '/dashboard' }}"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
        </div>
        <div class="appointments-card">
            <div class="table-responsive">
                <!-- ID AGREGADO: Identifica esta tabla en JavaScript -->
                <table class="table" id="tablaServicios">
                    <thead><tr><th>Servicio</th><th>Veces solicitado</th></tr></thead>
                    <tbody>
                        {% for row in servicioCounts %}<tr>
                            <td>{{ row.service }}</td>
                            <td>{{ row.total }}</td>
                        </tr>{% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>

<!-- SCRIPT AGREGADO: Procesa los datos y genera el archivo Excel -->
<script>
function exportarServiciosAExcel() {
    // Captura la tabla por su ID
    var tabla = document.getElementById('tablaServicios');
    
    // Transforma el HTML físico a formato Excel
    var libro = XLSX.utils.table_to_book(tabla, { sheet: "Servicios Solicitados" });
    
    // Dispara la descarga automática con el nombre personalizado
    XLSX.writeFile(libro, 'Reporte_Servicios_Solicitados_Shalom.xlsx');
}
</script>
</body>
</html>
