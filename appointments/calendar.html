<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendario de Citas — SHALOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Parisienne&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/vendor/fullcalendar/main.min.css" rel="stylesheet">
    <link href="/css/shalom-reset.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
{% include 'layouts/navbar.html' %}
<main>
    <div class="container-lg py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title mb-0"><i class="bi bi-calendar-week"></i> Calendario de Citas</h2>
            <a class="btn btn-outline-secondary" href="{{ '/appointments' }}"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>
<div class="card card-page p-4">
            <div style="overflow-x:auto;">
                <div id="calendar"></div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var events = {{ events|tojson }};
</script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'es',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: function(info, successCallback, failureCallback) {
            var data = [];
            document.querySelectorAll('.event-data').forEach(function(el) {
                data.push({
                    title: el.getAttribute('data-title'),
                    start: el.getAttribute('data-start')
                });
            });
            successCallback(data);
        },
        eventClick: function(info) {
            Swal.fire({ title: 'Cita', text: info.event.title, icon: 'info' });
        }
    });
    calendar.render();
});
</script>
{% for cita in appointments %}
    <div class="event-data d-none" data-title="{{ (cita.service.name|string + ' - ' + (((cita.user.name) if (cita.user != none) else ('')))) if (cita.service != none) else ('Cita') }}" data-start="{{ (cita.date|temporal('yyyy-MM-dd'))|string + 'T' + (cita.time|temporal('HH:mm')) }}"></div>
{% endfor %}
</body>
</html>
